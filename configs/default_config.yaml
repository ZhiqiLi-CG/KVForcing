independent_first_frame: false
warp_denoising_step: false
weight_decay: 0.01
same_step_across_blocks: true
discriminator_lr_multiplier: 1.0
last_step_only: false
i2v: false
num_training_frames: 21
gc_interval: 100
context_noise: 0
# ======== ours ========
# grad_mode: self_forcing | self_forcing_no_sg | kv_forcing
grad_mode: self_forcing
# one exit step drawn per rank (True) or one drawn on rank 0 and broadcast (False)
per_rank_exit_step: true
# what the KV write sees: the exit-step prediction ('exit') or the final clean one ('final_clean')
cache_mode: exit
# kv_forcing: write the memory with the same noised context and timestep the
# autoregressive rollout uses (True), or with the clean prediction at t=0 (False)
match_context: true
# kv_forcing: blocks per activation-checkpoint region (1 = every block; larger trades
# recomputation memory for fewer kept block outputs, numerically identical)
kv_forcing_checkpoint_group: 5
# kv_forcing options that keep the forward bitwise and only reorder additions in the
# backward pass (docs/kv_forcing.md); off, the step is bitwise the plain one.
#   fuse_grad_forwards: the noisy and the write forward of a frame as one batch-2 forward
#     (a faster generator step, for about 2 GiB more)
#   page_mode: kv | h. h keeps the writer's attention input instead of (K, V) as the page
#     that carries the graph: a lower generator-step peak. bf16 (mixed_precision: true) only.
kv_forcing_fuse_grad_forwards: false
kv_forcing_page_mode: kv
# with mixed_precision false, still run the frozen teacher (real_score) in bf16
real_score_bf16: false
# Memory-LoRA (model_kwargs.memory_lora: true): what the memory write runs.
#   coupled    the write forward uses (W + dW) for its own K/V and reads the LoRA pages; its pages carry the LoRA
#   decoupled  the write forward is the base network (own K/V W h, reads base pages of the earlier writes) and
#              writes, from the same h, a base page (read by later writes) and a LoRA page (W + dW) h (read by the
#              generation forwards). Training: grad_mode kv_forcing (page_mode kv: two page sets; h: one h page per
#              layer serves both); inference keeps two KV caches (pipeline/causal_inference.py).
memory_lora_write: coupled
# ==== ours end ====
causal: true

ckpt_step: 0
prompt_name: MovieGenVideoBench
prompt_path: prompts/MovieGenVideoBench.txt
eval_first_n: 64
num_samples: 1
height: 480
width: 832
num_frames: 81
# Full-state resume (trainer/distillation.py): every resume_every steps each rank saves its shards of the generator,
# the critic, both optimizers, the EMA and its RNG streams to resume_dir (default <logdir>/resume), and a restart with
# the same logdir continues from there. 0 disables it (a restart then begins at step 0).
resume_every: 0
resume_dir: ''
