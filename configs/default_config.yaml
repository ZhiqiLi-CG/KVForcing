independent_first_frame: false
warp_denoising_step: false
weight_decay: 0.01
same_step_across_blocks: true
discriminator_lr_multiplier: 1.0
last_step_only: false
i2v: false
num_training_frames: 21
gc_interval: 100
context_noise: 0
# ======== ours ========
# grad_mode: self_forcing | self_forcing_no_sg | kv_forcing
grad_mode: self_forcing
# one exit step drawn per rank (True) or one drawn on rank 0 and broadcast (False)
per_rank_exit_step: true
# what the KV write sees: the exit-step prediction ('exit') or the final clean one ('final_clean')
cache_mode: exit
# kv_forcing: write the memory with the same noised context and timestep the
# autoregressive rollout uses (True), or with the clean prediction at t=0 (False)
match_context: true
# ==== ours end ====
causal: true

ckpt_step: 0
prompt_name: MovieGenVideoBench
prompt_path: prompts/MovieGenVideoBench.txt
eval_first_n: 64
num_samples: 1
height: 480
width: 832
num_frames: 81
